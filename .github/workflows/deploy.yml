name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SERVER_HOST }}" || (echo "Missing SERVER_HOST" && exit 1)
          test -n "${{ secrets.SERVER_USER }}" || (echo "Missing SERVER_USER" && exit 1)
          test -n "${{ secrets.SERVER_SSH_KEY }}" || (echo "Missing SERVER_SSH_KEY" && exit 1)

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/root/intelligent_reimbursement' }}"
            cd "$DEPLOY_PATH"

            # 服务器到 GitHub 偶发 TLS 中断（GnuTLS -110），提高稳定性并重试
            git config http.version HTTP/1.1
            git config http.postBuffer 524288000

            retry() {
              n=0
              max=5
              delay=5
              until "$@"; do
                n=$((n + 1))
                if [ "$n" -ge "$max" ]; then
                  echo "command failed after ${max} attempts: $*"
                  return 1
                fi
                echo "retry ${n}/${max} in ${delay}s: $*"
                sleep "$delay"
                delay=$((delay * 2))
              done
            }

            retry git fetch --all --prune
            git checkout main
            retry git pull --ff-only origin main
            docker compose --env-file .env.prod up -d --build --remove-orphans
            docker image prune -f
