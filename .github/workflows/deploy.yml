name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.SERVER_HOST }}" || (echo "Missing SERVER_HOST" && exit 1)
          test -n "${{ secrets.SERVER_USER }}" || (echo "Missing SERVER_USER" && exit 1)
          test -n "${{ secrets.SERVER_SSH_KEY }}" || (echo "Missing SERVER_SSH_KEY" && exit 1)
          test -n "${{ secrets.GIT_DEPLOY_KEY }}" || (echo "Missing GIT_DEPLOY_KEY" && exit 1)

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          GIT_DEPLOY_KEY: ${{ secrets.GIT_DEPLOY_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          timeout: 60s
          command_timeout: 90m
          envs: GIT_DEPLOY_KEY
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/root/intelligent_reimbursement' }}"
            cd "$DEPLOY_PATH"

            # 使用 Deploy key 经 SSH 拉取，避免 HTTPS/GnuTLS 偶发中断
            install -m 700 -d "$HOME/.ssh"
            printf '%s\n' "$GIT_DEPLOY_KEY" > "$HOME/.ssh/github_deploy"
            chmod 600 "$HOME/.ssh/github_deploy"
            trap 'rm -f "$HOME/.ssh/github_deploy"' EXIT
            ssh-keyscan -t ed25519,rsa github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/github_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
            git remote set-url origin git@github.com:dwqnidq/intelligent_reimbursement.git

            retry() {
              n=0
              max=5
              delay=5
              until "$@"; do
                n=$((n + 1))
                if [ "$n" -ge "$max" ]; then
                  echo "command failed after ${max} attempts: $*"
                  return 1
                fi
                echo "retry ${n}/${max} in ${delay}s: $*"
                sleep "$delay"
                delay=$((delay * 2))
              done
            }

            retry git fetch --all --prune
            git checkout main
            retry git pull --ff-only origin main
            docker compose --env-file .env.prod up -d --build --remove-orphans
            docker image prune -f
